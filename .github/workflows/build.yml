name: Build latest Caddy

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caddy

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      caddy: ${{ steps.version.outputs.caddy }}
      proxy: ${{ steps.version.outputs.proxy }}
      cloudflare: ${{ steps.version.outputs.cloudflare }}
      cloudflare_ip: ${{ steps.version.outputs.cloudflare_ip }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.check.outputs.build }}

    steps:
      - name: Get latest stable versions
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CADDY_TAG="$(gh api repos/caddyserver/caddy/releases/latest --jq '.tag_name')"
          PROXY_TAG="$(gh api repos/lucaslorentz/caddy-docker-proxy/releases/latest --jq '.tag_name')"

          # caddy-dns/cloudflare has no GitHub releases, only git tags
          CF_TAG="$(
            gh api 'repos/caddy-dns/cloudflare/tags?per_page=100' --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1
          )"

          # caddy-cloudflare-ip has no tags or releases, track the latest commit on main
          CF_IP_SHA="$(gh api repos/WeidiDeng/caddy-cloudflare-ip/commits/main --jq '.sha')"

          test -n "${CADDY_TAG}" -a -n "${PROXY_TAG}" -a -n "${CF_TAG}" -a -n "${CF_IP_SHA}"

          CADDY="${CADDY_TAG#v}"
          TAG="${CADDY}-dp${PROXY_TAG#v}-cf${CF_TAG#v}-ip${CF_IP_SHA:0:7}"

          echo "Caddy:              ${CADDY_TAG}"
          echo "caddy-docker-proxy: ${PROXY_TAG}"
          echo "caddy-dns/cloudflare: ${CF_TAG}"
          echo "caddy-cloudflare-ip: ${CF_IP_SHA}"
          echo "Image tag:          ${TAG}"

          {
            echo "caddy=${CADDY}"
            echo "proxy=${PROXY_TAG}"
            echo "cloudflare=${CF_TAG}"
            echo "cloudflare_ip=${CF_IP_SHA}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker buildx imagetools inspect \
            "${IMAGE}:${{ steps.version.outputs.tag }}" \
            >/dev/null 2>&1
          then
            echo "Image already exists"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New Caddy or plugin version found"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true

          build-args: |
            CADDY_VERSION=${{ needs.check.outputs.caddy }}
            PROXY_VERSION=${{ needs.check.outputs.proxy }}
            CLOUDFLARE_VERSION=${{ needs.check.outputs.cloudflare }}
            CLOUDFLARE_IP_VERSION=${{ needs.check.outputs.cloudflare_ip }}

          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.tag }}
            ${{ env.IMAGE }}:${{ needs.check.outputs.caddy }}
            ${{ env.IMAGE }}:latest
