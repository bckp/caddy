name: Build latest Caddy

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caddy

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.check.outputs.build }}

    steps:
      - name: Get latest stable Caddy
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(
            gh api repos/caddyserver/caddy/releases/latest \
              --jq '.tag_name | ltrimstr("v")'
          )"

          echo "Latest Caddy: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker buildx imagetools inspect \
            "${IMAGE}:${{ steps.version.outputs.version }}" \
            >/dev/null 2>&1
          then
            echo "Image already exists"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New Caddy version found"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CADDY_VERSION=${{ needs.check.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
            ${{ env.IMAGE }}:latest
